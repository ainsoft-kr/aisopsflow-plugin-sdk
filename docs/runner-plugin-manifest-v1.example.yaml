api_version: runner-plugin/v1
kind: RunnerPlugin
metadata:
  name: microsoft-email
  display_name: Microsoft Email
  plugin_version: 0.1.0
  publisher: aisopsflow
  description: Read and send Microsoft 365 mail through Microsoft Graph.
  homepage: https://github.com/your-org/aisopsflow-plugin-microsoft-email
runtime:
  type: node
  entrypoint: src/index.js
  working_dir: .
  protocol: stdio-json
install:
  layout: unpacked-directory
  root: .
capabilities:
  provides:
    - microsoft.mail.read
    - microsoft.mail.send
    - email.read
    - email.send
execution:
  startup_timeout_seconds: 10
  request_timeout_seconds: 30
  idle_ttl_seconds: 120
  max_concurrency: 4
  restart_policy: on-failure
env:
  required:
    - name: MICROSOFT_GRAPH_ACCESS_TOKEN
      secret: true
      description: OAuth access token used for Microsoft Graph API calls.
  optional:
    - name: MICROSOFT_GRAPH_BASE_URL
      secret: false
      default: https://graph.microsoft.com/v1.0
    - name: LOG_LEVEL
      secret: false
      default: info
permissions:
  network:
    outbound:
      - host: graph.microsoft.com
        ports:
          - 443
  filesystem:
    read:
      - /tmp
    write: []
security:
  verification:
    internal_auth: true
    signed_manifest: recommended
  data_handling:
    log_secrets: false
    redact_fields:
      - authorization
      - access_token
compatibility:
  runner_api:
    min: v1
    max: v1
  product:
    min: 0.1.0
    max: 0.x
observability:
  health_check:
    type: startup-message
    success_pattern: listening
  logs:
    format: json-lines
examples:
  invoke:
    capability: microsoft.mail.read
    input:
      user_id: me
      top: 10
      search: incident
