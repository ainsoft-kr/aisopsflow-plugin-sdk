api_version: runner-plugin/v1
kind: RunnerPlugin
metadata:
  name: kakao-provider-mock
  display_name: Kakao AlimTalk Provider Mock
  plugin_version: 0.1.0
  publisher: aisopsflow
runtime:
  type: node
  entrypoint: src/runner-entrypoint.ts
  working_dir: .
  protocol: stdio-json
install:
  layout: unpacked-directory
  root: .
capabilities:
  provides:
    - kakao.alimtalk.send
execution:
  startup_timeout_seconds: 10
  request_timeout_seconds: 30
  idle_ttl_seconds: 60
  max_concurrency: 2
env:
  required:
    - name: AISOPSFLOW_INTERNAL_AUTH_TOKEN
      secret: true
  optional:
    - name: SIMULATOR_URL
      secret: false
      default: http://kakao_simulator:9010
permissions:
  network:
    outbound:
      - host: kakao_simulator
        ports:
          - 9010
  filesystem:
    read: []
    write: []
security:
  verification:
    internal_auth: true
compatibility:
  runner_api:
    min: v1
    max: v1
