api_version: v1
plugin_name: microsoft-office
plugin_version: 0.1.0
display_name: Microsoft Office Plugin
category: provider
entrypoints:
  probe: /probe
  health: /healthz
  get_file: /office/files/get
  create_file: /office/files/create
  update_file: /office/files/update
  delete_file: /office/files/delete
compatibility:
  runner_api: v1
capabilities:
  - microsoft.office.read
  - microsoft.office.write
  - microsoft.office.delete
security:
  internal_auth: required
  oauth_access_token: required
