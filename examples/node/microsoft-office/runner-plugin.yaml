api_version: runner-plugin/v1
kind: RunnerPlugin
metadata:
  name: microsoft-office
  display_name: Microsoft Office
  plugin_version: 0.1.0
  publisher: aisopsflow
runtime:
  type: node
  entrypoint: src/runner-entrypoint.ts
  working_dir: .
  protocol: stdio-json
install:
  layout: unpacked-directory
  root: .
capabilities:
  provides:
    - microsoft.office.read
    - microsoft.office.write
    - microsoft.office.delete
execution:
  startup_timeout_seconds: 10
  request_timeout_seconds: 30
  idle_ttl_seconds: 60
  max_concurrency: 2
env:
  required:
    - name: AISOPSFLOW_INTERNAL_AUTH_TOKEN
      secret: true
    - name: MICROSOFT_GRAPH_ACCESS_TOKEN
      secret: true
  optional:
    - name: MICROSOFT_GRAPH_BASE_URL
      secret: false
      default: https://graph.microsoft.com/v1.0
permissions:
  network:
    outbound:
      - host: graph.microsoft.com
        ports:
          - 443
  filesystem:
    read: []
    write: []
security:
  verification:
    internal_auth: true
compatibility:
  runner_api:
    min: v1
    max: v1
