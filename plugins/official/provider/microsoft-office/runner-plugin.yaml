api_version: runner-plugin/v1
kind: RunnerPlugin
metadata:
  name: microsoft-office
  display_name: Microsoft Office
  plugin_version: 0.1.0
  publisher: aisopsflow
runtime:
  type: node
  entrypoint: src/runner-entrypoint.ts
  working_dir: .
  protocol: stdio-json
install:
  layout: unpacked-directory
  root: .
capabilities:
  provides:
    - microsoft.office.read
    - microsoft.office.write
    - microsoft.office.delete
    - office.excel.generate
    - office.word.generate
    - office.powerpoint.generate
execution:
  startup_timeout_seconds: 10
  request_timeout_seconds: 60
  idle_ttl_seconds: 60
  max_concurrency: 2
env:
  required:
    - name: AISOPSFLOW_INTERNAL_AUTH_TOKEN
      secret: true
permissions:
  network:
    outbound: []
  filesystem:
    read:
      - /tmp
      - /app/workspace
    write:
      - /tmp
      - /app/workspace
security:
  verification:
    internal_auth: true
compatibility:
  runner_api:
    min: v1
    max: v1
