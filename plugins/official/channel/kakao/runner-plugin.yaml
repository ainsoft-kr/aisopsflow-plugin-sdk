api_version: runner-plugin/v1
kind: RunnerPlugin
metadata:
  name: kakao-provider
  display_name: Kakao AlimTalk Provider
  plugin_version: 0.2.0
  publisher: aisopsflow
runtime:
  type: node
  entrypoint: src/runner-entrypoint.ts
  working_dir: .
  protocol: stdio-json
install:
  layout: unpacked-directory
  root: .
capabilities:
  provides:
    - kakao.alimtalk.send
execution:
  startup_timeout_seconds: 10
  request_timeout_seconds: 30
  idle_ttl_seconds: 60
  max_concurrency: 2
env:
  required:
    - name: KAKAO_BIZ_PROVIDERS_JSON
      secret: true
  optional: []
permissions:
  network:
    outbound:
      - https
  filesystem:
    read: []
    write: []
security:
  verification:
    internal_auth: false
compatibility:
  runner_api:
    min: v1
    max: v1
